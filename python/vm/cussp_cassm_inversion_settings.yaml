# ---------------------------------------------------------------------------

site:
  name: CUSSP_new_site
  coordinate_frame: hmc-grid-nad27-utm13

geometry:
  station_file: /home/chopp/stations_hmc.csv
  station_xyz_columns: [hmc_east_m, hmc_north_m, hmc_z_minus_depth_m]
  station_fallback_z_column: hmc_z_m_asl

  # Source geometry should be provided as CSV with columns:
  # source_id,x,y,z
  source_file: /data/chet-cussp/cassm/sources_hmc.csv
  source_xyz_columns: [x, y, z]

  # Optional pair-level exclusions for known bad channels/sources.
  # Leave null/empty for new site commissioning.
  reject_pairs_file: null

velocity:
  vp_background_mps: 6900.0
  slowness_background_s_per_m: auto_from_vp

grid:
  spacing_m: [0.5, 0.5, 0.5]
  # auto bounds = min/max over sources+receivers padded by margin_m
  margin_m: 0.5
  explicit_bounds: null
  # explicit_bounds format (if provided):
  # [xmin, xmax, ymin, ymax, zmin, zmax]

regularization:
  kap_xyz: [1.0, 1.0, 1.0]
  reg_xyz: [1.0, 1.0, 1.0]
  max_iter: 10
  rel_step: 0.2
  nl_residual: 1.0e-6

prior_mask:
  # IMPORTANT: for the new site, do not localize to a fault zone.
  mode: full_domain
  default_weight: 1.0

qc:
  # Keep strict assumptions off for commissioning. Enable only after baseline QC.
  drop_known_bad_sources: []
  variance_reject_fraction: 0.0
  min_snr_db: null
