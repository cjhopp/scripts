# CUSSP CASSM inversion settings (site-portable defaults)
# Uses the same station geometry source schema as dash_apps/cussp_seismicity_3d.py.

# ---------------------------------------------------------------------------
# Array configuration catalog
# ---------------------------------------------------------------------------
#
# Receiver channel count = (n_accelerometers * 3) + n_hydrophones
#   - 16 3-component accelerometers always present
#   - 24-channel hydrophone array is in the TS well; removed during flow tests
#   - 4 TS-well sources present during EGS Collab initial experiment only
#
# Variable dimensions across experiments / phases:
#
#   Experiment     Phase          n_sources  n_acc  n_hydro  n_receivers  n_pairs
#   EGS_Collab     initial            20       16      24        72        1440
#   EGS_Collab     flow_test          16       16       0        48         768
#   DEMO_FTES      initial            16       16      24        72        1152
#   DEMO_FTES      flow_test          16       16       0        48         768
#   CUSSP          (single)           16       16      24        72        1152
#
# NOTE: Early Python processing runs used --n-receivers 44, which was mistakenly
# carried over from FSC MATLAB code for a different array.  All processing for
# CUSSP must use n_receivers=72.  Caches built with 44 receivers are invalid.

acquisition:
  known_configurations:

    egs_collab_initial:
      experiment: EGS_Collab
      phase: initial
      description: "Full array — TS-well sources and TS-well hydrophone array both installed"
      hydrophone_preamp_lowpass_hz: 2000
      hydrophone_band_note: "Hydrophone channels were hardware low-pass filtered at 2 kHz"
      n_sources: 20             # 16 standard + 4 TS-well borehole sources
      n_accelerometers: 16      # 3-component; each contributes 3 channels
      n_hydrophones: 24         # TS-well hydrophone string
      n_receivers: 72           # = 16*3 + 24
      n_pairs: 1440             # = 20 * 72

    egs_collab_flow_test:
      experiment: EGS_Collab
      phase: flow_test
      description: "TS-well sources and hydrophone array removed for flow test"
      n_sources: 16
      n_accelerometers: 16
      n_hydrophones: 0          # TS-well hydrophone array not installed
      n_receivers: 48           # = 16*3
      n_pairs: 768              # = 16 * 48

    demo_ftes_initial:
      experiment: DEMO_FTES
      phase: initial
      description: "TS-well hydrophone array installed; TS-well sources not installed"
      n_sources: 16
      n_accelerometers: 16
      n_hydrophones: 24
      n_receivers: 72           # = 16*3 + 24
      n_pairs: 1152             # = 16 * 72

    demo_ftes_flow_test:
      experiment: DEMO_FTES
      phase: flow_test
      description: "TS-well hydrophone array removed for flow test"
      n_sources: 16
      n_accelerometers: 16
      n_hydrophones: 0
      n_receivers: 48           # = 16*3
      n_pairs: 768              # = 16 * 48

    cussp:
      experiment: CUSSP
      phase: only
      description: "Single configuration throughout — TS-well sources never installed, hydrophone array present"
      n_sources: 16
      n_accelerometers: 16
      n_hydrophones: 24
      n_receivers: 72           # = 16*3 + 24
      n_pairs: 1152             # = 16 * 72

  # Active configuration for this processing run.
  # Processing scripts should read n_sources and n_receivers from here
  # rather than relying on CLI defaults.
  active: cussp

  # Source channel map — maps 0-based source index (= .dat file sort order) to borehole and depth.
  # Channels 17-20 (WMW/TS-well) are EGS Collab only; not present in CUSSP.
  source_channel_map:
    - {source_index:  0, channel:  1, borehole: AML, depth_m: 14.518}
    - {source_index:  1, channel:  2, borehole: AML, depth_m: 28.310}
    - {source_index:  2, channel:  3, borehole: AML, depth_m: 42.072}
    - {source_index:  3, channel:  4, borehole: AML, depth_m: 55.788}
    - {source_index:  4, channel:  5, borehole: AMU, depth_m: 14.435}
    - {source_index:  5, channel:  6, borehole: AMU, depth_m: 28.212}
    - {source_index:  6, channel:  7, borehole: AMU, depth_m: 41.989}
    - {source_index:  7, channel:  8, borehole: AMU, depth_m: 55.736}
    - {source_index:  8, channel:  9, borehole: DML, depth_m: 13.862}
    - {source_index:  9, channel: 10, borehole: DML, depth_m: 26.115}
    - {source_index: 10, channel: 11, borehole: DML, depth_m: 38.307}
    - {source_index: 11, channel: 12, borehole: DML, depth_m: 50.530}
    - {source_index: 12, channel: 13, borehole: DMU, depth_m: 13.945}
    - {source_index: 13, channel: 14, borehole: DMU, depth_m: 26.137}
    - {source_index: 14, channel: 15, borehole: DMU, depth_m: 38.420}
    - {source_index: 15, channel: 16, borehole: DMU, depth_m: 50.642}

  # Configuration history with date constraints.
  # Use exact ISO dates where known; otherwise keep null and record bounds/notes.
  configuration_periods:
    - configuration: egs_collab_initial
      start_date: "2022-04-01"
      end_date: "2022-09-14"
      notes: "Full array for entire EGS Collab dataset; no observed flow_test phase in this archive"

    - configuration: demo_ftes_initial
      start_date: null
      start_date_after: "2024-10-31"
      end_date: "2025-03-05"
      notes: "Hydrophone string installed until removal on 2025-03-06"

    - configuration: demo_ftes_flow_test
      start_date: "2025-03-06"
      end_date: null
      notes: "Hydrophone string removed"

    - configuration: cussp
      start_date: "2026-05-11"
      end_date: null
      notes: "Single-configuration run with hydrophones present; start date set from earliest archived epoch (20260511224620)"

  # ---------------------------------------------------------------------------
  # Physical channel map — fixed for all experiments on this Geode system.
  # Each .dat file always contains exactly 76 channels:
  #   channels  1-48  : 16 three-component accelerometers (always present)
  #   channels 49-72  : 24 TS-well hydrophones (present only in full config)
  #   channels 73-76  : system channels (Clock, Encoding, Monitor, Trigger)
  #                     — these are NOT seismic data and must always be excluded.
  #                       The n_receivers <= 72 filter in the loader handles this.
  #
  # Channel 72 (TS01) is permanently flagged bad (see known_bad_receiver_channels).
  # ---------------------------------------------------------------------------
  n_channels_per_file: 76
  system_channels: [73, 74, 75, 76]   # Clock, Encoding, Monitor, Trigger

  # Known bad receiver channels (1-based Geode channel numbers).
  # These channels are zeroed at ingest and excluded from picking/metrics.
  # The processor emits a WARNING for each one on first encounter.
  known_bad_receiver_channels:
    - channel: 72
      sensor: TS01
      component: XDH
      borehole: TS01
      depth_m: null        # depth unknown / BAD label in source table
      reason: "BAD — flagged in original channel map; do not use"

